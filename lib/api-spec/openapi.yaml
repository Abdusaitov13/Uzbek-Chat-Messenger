openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Direct messaging operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List the signed-in user's conversations
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start or return a direct conversation by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
  /chat/contacts:
    get:
      operationId: searchContacts
      tags: [chat]
      summary: Search Suhbat users by name, email, or username
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
  /chat/profile:
    get:
      operationId: getProfile
      tags: [chat]
      summary: Get the signed-in user's profile and privacy settings
      responses:
        "200":
          description: Profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [chat]
      summary: Update the signed-in user's profile and privacy settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /chat/groups:
    post:
      operationId: createGroup
      tags: [chat]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
  /chat/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMessages
      tags: [chat]
      summary: List recent messages in a conversation
      responses:
        "200":
          description: Messages ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversationSummary:
      type: object
      required:
        - id
        - userId
        - displayName
        - email
        - lastMessage
        - lastMessageAt
        - lastMessageByMe
        - type
        - title
      properties:
        id:
          type: string
        userId:
          type: [string, "null"]
        displayName:
          type: string
        email:
          type: [string, "null"]
          format: email
        type:
          type: string
          enum: [direct, group]
        title:
          type: [string, "null"]
        lastMessage:
          type: [string, "null"]
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        lastMessageByMe:
          type: boolean
    Message:
      type: object
      required: [id, conversationId, senderId, senderName, text, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    ConversationInput:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail:
          type: string
          format: email
          maxLength: 320
    Contact:
      type: object
      required: [id, displayName, email, username]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        username:
          type: [string, "null"]
    UserProfile:
      type: object
      required: [firstName, lastName, dateOfBirth, username, bio, isSearchable, showLastSeen]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: [string, "null"]
          format: date
        username:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        isSearchable:
          type: boolean
        showLastSeen:
          type: boolean
    ProfileInput:
      type: object
      required: [firstName, lastName, dateOfBirth, username, bio, isSearchable, showLastSeen]
      properties:
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        dateOfBirth:
          type: [string, "null"]
          format: date
        username:
          type: [string, "null"]
          maxLength: 32
          pattern: "^[A-Za-z0-9_]{3,32}$"
        bio:
          type: [string, "null"]
          maxLength: 180
        isSearchable:
          type: boolean
        showLastSeen:
          type: boolean
    GroupInput:
      type: object
      required: [memberIds]
      properties:
        title:
          type: string
          maxLength: 100
        memberIds:
          type: array
          minItems: 2
          maxItems: 99
          uniqueItems: true
          items:
            type: string
    MessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000

